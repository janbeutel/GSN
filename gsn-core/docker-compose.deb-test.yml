services:
  gsn-deb-test:
    build:
      context: .
      dockerfile: docker/deb-test/Dockerfile
    container_name: gsn-deb-test
    privileged: true
    cgroup: host
    tty: true
    stdin_open: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Mount generated package artifacts for easy install in container.
      - ./build/distributions:/packages:ro
